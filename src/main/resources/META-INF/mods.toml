modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Purely client-side: Forge skips loading it on dedicated servers and
# automatically sets displayTest=IGNORE_ALL_VERSION so servers never show a red X.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
